<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <rect width="600" height="340" rx="20" fill="#1A2F46" />
  <!-- Left: 4 Elements of Image Prompt -->
  <g transform="translate(32, 34)">
    <rect width="250" height="272" rx="14" fill="#FFFFFF" />
    <text x="24" y="38" fill="#1F3A4B" font-family="Noto Sans TC, sans-serif" font-size="16" font-weight="700">圖片提示語四大要素</text>
