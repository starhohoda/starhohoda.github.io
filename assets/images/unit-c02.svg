    <line x1="28" y1="102" x2="156" y2="102" stroke="#9BB0BF" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="122" x2="132" y2="122" stroke="#9BB0BF" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="148" x2="156" y2="148" stroke="#9BB0BF" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="168" x2="142" y2="168" stroke="#9BB0BF" stroke-width="4" stroke-linecap="round" />
