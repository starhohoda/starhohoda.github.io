      <text x="55" y="34" text-anchor="middle" fill="#1F3A4B" font-family="Noto Sans TC, sans-serif" font-size="13" font-weight="700">1. 描述需求</text>
      <text x="55" y="64" text-anchor="middle" fill="#57768A" font-family="Noto Sans TC, sans-serif" font-size="11">規劃頁面架構</text>
      <text x="55" y="84" text-anchor="middle" fill="#57768A" font-family="Noto Sans TC, sans-serif" font-size="11">色彩與導覽</text>
      <rect x="20" y="102" width="70" height="18" rx="4" fill="#E6EFF6" />
    </g>
    <g transform="translate(147, 62)">
      <rect width="110" height="135" rx="10" fill="#FFFFFF" stroke="#D5DFE5" stroke-width="1.5" />
      <text x="55" y="34" text-anchor="middle" fill="#1F3A4B" font-family="Noto Sans TC, sans-serif" font-size="13" font-weight="700">2. 建立原型</text>
      <text x="55" y="64" text-anchor="middle" fill="#57768A" font-family="Noto Sans TC, sans-serif" font-size="11">生成網頁畫面</text>
      <text x="55" y="84" text-anchor="middle" fill="#57768A" font-family="Noto Sans TC, sans-serif" font-size="11">與區塊版型</text>
      <rect x="20" y="102" width="70" height="18" rx="4" fill="#F9F1DF" />
    </g>
    <g transform="translate(270, 62)">
      <rect width="110" height="135" rx="10" fill="#FFFFFF" stroke="#D5DFE5" stroke-width="1.5" />
      <text x="55" y="34" text-anchor="middle" fill="#1F3A4B" font-family="Noto Sans TC, sans-serif" font-size="13" font-weight="700">3. 檢查互動</text>
      <text x="55" y="64" text-anchor="middle" fill="#57768A" font-family="Noto Sans TC, sans-serif" font-size="11">測試選單連結</text>
      <text x="55" y="84" text-anchor="middle" fill="#57768A" font-family="Noto Sans TC, sans-serif" font-size="11">手機與電腦版</text>
      <rect x="20" y="102" width="70" height="18" rx="4" fill="#E6F2EA" />
