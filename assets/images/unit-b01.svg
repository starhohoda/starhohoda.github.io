<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <rect width="600" height="340" rx="20" fill="#1B3248" />
  <!-- Browser Window Mockup inside Laptop Concept -->
  <g transform="translate(36, 30)">
    <rect width="528" height="280" rx="14" fill="#F7F5EF" stroke="#E9C86A" stroke-width="2" />
    <rect width="528" height="38" rx="14" fill="#1F3A4B" />
    <circle cx="22" cy="19" r="5" fill="#E9C86A" />
    <circle cx="38" cy="19" r="5" fill="#9BC2E2" />
    <circle cx="54" cy="19" r="5" fill="#8CC0A1" />
    <text x="264" y="24" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans TC, sans-serif" font-size="13" font-weight="600">Google AI Studio 網站建置流程示意</text>
    <!-- 4 Workflow Cards -->
    <g transform="translate(24, 62)">
