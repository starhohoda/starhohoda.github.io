    <rect x="24" y="216" width="480" height="42" rx="8" fill="#F9F1DF" stroke="#E9C86A" stroke-width="1.5" />
    <text x="264" y="242" text-anchor="middle" fill="#1F3A4B" font-family="Noto Sans TC, sans-serif" font-size="13" font-weight="600">功能概覽與操作規劃：區分「即時預覽」、「原始碼匯出」與「正式網站部署」</text>
