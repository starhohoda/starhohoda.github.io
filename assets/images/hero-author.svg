<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none">
  <defs>
    <linearGradient id="authorWindow" x1="420" y1="0" x2="420" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101D36" />
      <stop offset="100%" stop-color="#27475E" />
    </linearGradient>
  </defs>
  <!-- Warm Studio Backdrop -->
  <rect width="640" height="440" rx="24" fill="#F2EFE7" />

  <!-- Night Window in Background -->
  <rect x="270" y="18" width="210" height="250" rx="10" fill="url(#authorWindow)" stroke="#D5C8B2" stroke-width="6" />
  <line x1="375" y1="18" x2="375" y2="268" stroke="#D5C8B2" stroke-width="4" />
  <line x1="270" y1="140" x2="480" y2="140" stroke="#D5C8B2" stroke-width="4" />
  <!-- Stars in Window -->
  <circle cx="315" cy="65" r="2" fill="#F6DF96" />
  <circle cx="425" cy="55" r="2.2" fill="#FFF" />
  <path d="M340 85L342 91L348 93L342 95L340 101L338 95L332 93L338 91L340 85Z" fill="#E9C86A" />

  <!-- Bookshelf at Right -->
  <rect x="500" y="20" width="125" height="280" rx="8" fill="#1B3144" />
  <rect x="512" y="105" width="100" height="6" fill="#5A4638" />
  <rect x="512" y="195" width="100" height="6" fill="#5A4638" />
  <!-- Glowing Globe on Shelf -->
  <circle cx="562" cy="152" r="24" fill="#E9C86A" fill-opacity="0.35" stroke="#E9C86A" stroke-width="2" />
  <path d="M544 172C555 182 572 182 582 170" stroke="#C5A24A" stroke-width="3" stroke-linecap="round" />
  <rect x="554" y="180" width="16" height="8" rx="2" fill="#C5A24A" />

  <!-- Desk Surface -->
  <rect x="0" y="325" width="640" height="115" fill="#DFD5C5" />
  <line x1="0" y1="325" x2="640" y2="325" stroke="#C4B59D" stroke-width="3" />

  <!-- Female Creator Illustration (Original Character "銀河霜月") -->
  <g transform="translate(275, 65)">
    <!-- Hair Bun & Flowing Brown Hair -->
    <circle cx="145" cy="24" r="22" fill="#46332A" />
    <path d="M55 95C58 42 105 22 142 35C175 48 185 95 178 155C172 195 160 220 145 230H50C42 195 52 135 55 95Z" fill="#46332A" />
    <!-- Warm Cream Knit Sweater -->
    <path d="M40 162C52 138 78 130 112 132C146 134 168 155 172 245H28C26 205 30 182 40 162Z" fill="#F5EFE6" stroke="#C7B8A1" stroke-width="2.2" />
    <!-- Neck & Face -->
    <rect x="88" y="112" width="24" height="24" rx="8" fill="#FCE5D2" />
    <path d="M68 72C68 48 128 48 128 78C128 106 110 122 94 122C78 122 68 102 68 72Z" fill="#FCE5D2" stroke="#5A4236" stroke-width="1.8" />
    <!-- Eyes & Gentle Smile -->
    <circle cx="82" cy="82" r="3.2" fill="#3B2820" />
    <circle cx="106" cy="84" r="3.2" fill="#3B2820" />
    <path d="M77 73C81 70 86 70 89 72" stroke="#46332A" stroke-width="2" stroke-linecap="round" />
    <path d="M101 74C105 71 110 72 113 74" stroke="#46332A" stroke-width="2" stroke-linecap="round" />
    <path d="M88 102C92 105 97 105 101 102" stroke="#B87D6A" stroke-width="2" stroke-linecap="round" />
    <!-- Forehead Bangs -->
    <path d="M66 72C72 52 95 46 118 56C126 60 132 72 130 85C122 70 108 62 92 64C78 66 70 72 66 72Z" fill="#46332A" />
    <!-- Hand Holding Pen Thoughtfully -->
    <line x1="35" y1="115" x2="78" y2="102" stroke="#1F3A4B" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="58" cy="112" r="10" fill="#FCE5D2" stroke="#C7B8A1" stroke-width="1.5" />
  </g>

  <!-- Sleeping Cat on Stack of Books -->
  <g transform="translate(475, 255)">
    <rect x="10" y="52" width="120" height="18" rx="4" fill="#2E4A62" stroke="#1F3A4B" stroke-width="2" />
    <rect x="4" y="70" width="130" height="20" rx="4" fill="#5E493A" stroke="#1F3A4B" stroke-width="2" />
    <!-- Cat Body -->
    <ellipse cx="70" cy="40" rx="42" ry="22" fill="#FFFFFF" stroke="#5A524C" stroke-width="2" />
    <path d="M45 24C55 20 75 22 85 32C72 34 55 32 45 24Z" fill="#8C857B" />
    <!-- Cat Ears & Closed Eyes -->
    <path d="M36 28L40 14L50 22Z" fill="#8C857B" stroke="#5A524C" stroke-width="1.8" />
    <path d="M56 24L64 12L70 23Z" fill="#8C857B" stroke="#5A524C" stroke-width="1.8" />
    <path d="M42 36C45 39 49 39 52 36" stroke="#5A524C" stroke-width="1.8" stroke-linecap="round" />
    <path d="M58 36C61 39 65 39 68 36" stroke="#5A524C" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Laptop & Starry Coffee Mug on Desk -->
  <g transform="translate(215, 252)">
    <path d="M0 0H125L138 82H12L0 0Z" fill="#B8C4CE" stroke="#1F3A4B" stroke-width="2.2" stroke-linejoin="round" />
    <circle cx="69" cy="41" r="8" fill="#DCE4EC" />
    <path d="M138 82H195L185 88H12L138 82Z" fill="#8FA0B0" stroke="#1F3A4B" stroke-width="2" />
  </g>
  <!-- Starry Mug -->
  <g transform="translate(435, 295)">
    <rect x="0" y="0" width="38" height="44" rx="6" fill="#1F3A4B" stroke="#101D36" stroke-width="2" />
    <path d="M38 10H46C50 10 52 14 52 20C52 26 50 30 46 30H38" stroke="#1F3A4B" stroke-width="3.5" />
    <path d="M19 14L21 19L26 21L21 23L19 28L17 23L12 21L17 19L19 14Z" fill="#E9C86A" />
  </g>
</svg>
