    <text x="75" y="76" text-anchor="middle" fill="#1F3A4B" font-family="Noto Sans TC, sans-serif" font-size="15" font-weight="700">辨識關鍵資訊</text>
    <text x="75" y="102" text-anchor="middle" fill="#57768A" font-family="Noto Sans TC, sans-serif" font-size="12">日期、數據、專有名詞</text>
  </g>
  <path d="M206 156H220" stroke="#57768A" stroke-width="2.5" stroke-linecap="round" />
  <g transform="translate(225, 92)">
